name: sphere_view
description: >-
  Capture a true 360°×180° spherical panorama from a handheld phone or tablet
  and stitch it into a single equirectangular image, with a built-in
  GPU-accelerated 360° viewer.
version: 0.1.0
# TODO(release): these three are still placeholders. `pub publish` will accept
# them — they are well-formed URLs — and pub.dev will render three dead links on
# the package page, which is worse than having none. Set them before the first
# publish; there is no automated check that can tell a real org from `your-org`.
homepage: https://github.com/your-org/sphere_view
repository: https://github.com/your-org/sphere_view
issue_tracker: https://github.com/your-org/sphere_view/issues

# pub.dev shows five at most, and these are the five somebody would actually
# search for. `photosphere` is here rather than `photo-sphere` because that is
# the spelling in the XMP namespace this package writes.
topics:
  - camera
  - panorama
  - 360
  - photosphere
  - stitching

environment:
  sdk: ^3.11.0
  # 3.19.0 is where `FragmentProgram.fromAsset` and the `shaders:` manifest key
  # settled, and the viewer is a fragment shader.
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # The stitch pipeline is native C++ reached over FFI (architecture §6.4).
  ffi: ^2.1.3
  vector_math: ^2.1.4
  # `@internal`, for the two seams the API audit found: members that must stay
  # reachable inside the package but that the analyzer should refuse to anybody
  # outside it.
  meta: ^1.16.0
  image: ^4.2.0
  path_provider: ^2.1.4
  path: ^1.9.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Phase 13 §2's public API audit. "No `src/` type leaks into a public
  # signature" is a property of the resolved element model, not of the text, so
  # `test/public_api_test.dart` resolves the barrel and walks it rather than
  # grepping for imports.
  # Pinned below 10.0.2: from there analyzer wants meta ^1.18, and flutter_test
  # pins meta to 1.17.0 from the SDK.
  analyzer: ">=10.0.0 <10.0.2"
  # Generates the camera/sensor platform interface in Phase 06.
  # 27.x rather than 22.x only because 22.x caps analyzer below 8 and the API
  # audit needs 10. The generated files are committed and are not regenerated
  # here; a future regeneration is a reviewable change either way.
  pigeon: ^27.3.0

flutter:
  # Phase 06: the package becomes a plugin. Architecture §5 explains why it has
  # to own its camera — bracketed hardware burst, real intrinsics, AE/AWB/AF
  # hard lock and frame timestamps are all flatly unavailable from Dart, and no
  # existing Flutter camera plugin exposes any of them.
  plugin:
    platforms:
      android:
        package: com.asite.sphereview
        pluginClass: SphereViewPlugin
      ios:
        pluginClass: SphereViewPlugin

  shaders:
    - lib/src/viewer/shaders/equirect.frag
